# Anonymous usage statistics: plugin id, a random installation id, plugin/
# Minecraft/Java versions, and online/max player counts - nothing that
# identifies this server. Sent to the official nicki41-telemetry instance,
# which is fixed and not configurable here.
telemetry:
  # false switches statistics off completely - no request of any kind is
  # made, no installation id is generated. Read again on every heartbeat,
  # so a restart is only needed to turn it back on, not off.
  enabled: true
