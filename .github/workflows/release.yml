name: Release

# Tag-driven releases: pushing a tag like v1.0.1 builds and - only if that
# succeeds - publishes a GitHub Release with the plugin jar and its SHA-256
# checksum. Nothing is published on an ordinary commit.
#
# Two ways to reach this workflow:
# - Manually: push a tag yourself.
# - Automatically: auto-release.yml pushes the version bump and the tag
#   itself, then calls this workflow directly via `workflow_call` (not by
#   relying on the tag push to trigger it - a push made with the default
#   GITHUB_TOKEN deliberately does not cascade into other workflow runs, see
#   auto-release.yml). Either path ends up here with the same build/publish
#   steps.

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.1) - set by auto-release.yml; unused on a direct tag push, where the triggering tag is used instead."
        required: true
        type: string

# contents: write is required to create the release and upload its assets.
# Nothing else is granted, and no secret beyond the automatic GITHUB_TOKEN is
# used. For the workflow_call path, this is only the ceiling - the actual
# grant is whatever the calling job's own `permissions:` allows.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the tag to build
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Guard against publishing a mislabelled release: tag v1.1.0 must not
      # ship a jar built from version 1.0.1. Runs before the build so a
      # mismatch fails fast.
      - name: Verify tag matches the project version
        id: version
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.tag.outputs.name }}"
          TAG_VERSION="${TAG_NAME#v}"
          PROJECT_VERSION="$(./gradlew -q --console=plain printVersion)"
          echo "Tag version:     $TAG_VERSION"
          echo "Project version: $PROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag '$TAG_NAME' does not match the project version '$PROJECT_VERSION' in build.gradle.kts."
            exit 1
          fi
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew clean build --console=plain

      # Exactly one installable artifact: the plugin jar.
      - name: Locate release jar and create SHA-256 checksum
        id: artifact
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          JAR="build/libs/LightBlockCrafting-${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::Expected release jar '$JAR' was not produced by the build."
            ls -l build/libs || true
            exit 1
          fi
          ( cd build/libs && sha256sum "LightBlockCrafting-${VERSION}.jar" \
              > "LightBlockCrafting-${VERSION}.jar.sha256" )
          cat "${JAR}.sha256"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "checksum=${JAR}.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "${{ steps.tag.outputs.name }}" \
            "${{ steps.artifact.outputs.jar }}" \
            "${{ steps.artifact.outputs.checksum }}" \
            --title "LightBlockCrafting ${VERSION}" \
            --generate-notes
          {
            echo "body<<GH_RELEASE_BODY_EOF"
            gh release view "${{ steps.tag.outputs.name }}" --json body -q .body
            echo "GH_RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Mirrors the same release onto the existing Modrinth project
      # (id qUa6uyXN). fail-mode: warn so a Modrinth-side hiccup doesn't mark
      # the whole release as failed - the GitHub release above has already
      # succeeded by this point.
      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: qUa6uyXN
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/LightBlockCrafting-*.jar
          name: LightBlockCrafting ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          changelog: ${{ steps.github_release.outputs.body }}
          # Matches the loaders already declared on the existing manually
          # uploaded 1.0.0 version - kept consistent rather than narrowed
          # unilaterally. MODRINTH.md documents Paper/Purpur/Pufferfish
          # compatibility; Pufferfish isn't its own Modrinth loader tag.
          loaders: |
            paper
            purpur
          # Documented, deliberate claim (see MODRINTH.md): the plugin only
          # relies on Bukkit/Paper APIs stable since 1.19.4.
          game-versions: ">=1.19.4 <=26.2"
          java: 17
          fail-mode: warn
